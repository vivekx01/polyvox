services:
  web:
    build: .
    image: polyvox:latest
    command: ["uvicorn", "polyvox.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    # No host port published: Coolify's Traefik proxy reaches this container
    # over the shared `coolify` network via labels, not a host-bound port —
    # and host ports 8000/8080/80/443 are already owned by Coolify itself.
    # For plain `docker compose up` outside Coolify, add your own override,
    # e.g. `docker compose run --service-ports web` or a local ports mapping.
    expose:
      - "8000"
    volumes:
      - audio_data:/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [coolify]

  worker:
    build: .
    image: polyvox:latest
    command: ["python", "-m", "polyvox.worker"]
    env_file: .env
    volumes:
      - audio_data:/data/audio
      - model_cache:/home/appuser/.cache
    restart: unless-stopped
    networks: [coolify]

volumes:
  audio_data:
  model_cache:

networks:
  # Shared Postgres/Redis (see .env.example: DATABASE_URL/REDIS_URL) live on this
  # pre-existing Coolify-managed network, not in this compose file.
  coolify:
    external: true
