{% extends "base.html" %}
{% block title %}Log in · Polyvox{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 sm:mt-24">
  <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8 tracking-tight">Polyvox</h1>
  <form method="post" action="/login" data-loading class="card p-6 sm:p-8 space-y-4">
    {% if error %}
    <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{{ error }}</p>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email</label>
      <input class="field" type="email" id="email" name="email" required autofocus autocomplete="username" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
      <input class="field" type="password" id="password" name="password" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary w-full">
      Log in
    </button>
  </form>
</div>
{% endblock %}
