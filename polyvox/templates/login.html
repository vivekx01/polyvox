{% extends "base.html" %}
{% block title %}Log in · Polyvox{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 sm:mt-20">
  <h1 class="text-2xl font-semibold text-center text-indigo-600 mb-8">Polyvox</h1>
  <form method="post" action="/login" class="bg-white border border-slate-200 rounded-lg p-6 space-y-4">
    {% if error %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2">{{ error }}</p>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email</label>
      <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
             type="email" id="email" name="email" required autofocus />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
      <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
             type="password" id="password" name="password" required />
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white rounded-md py-2 text-sm font-medium hover:bg-indigo-700">
      Log in
    </button>
  </form>
</div>
{% endblock %}
