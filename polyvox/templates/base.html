<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Polyvox{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'Roboto', ui-sans-serif, system-ui, sans-serif; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem;
      padding: 0.625rem 1.25rem; min-height: 2.5rem;
      transition: background-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
      cursor: pointer; border: none;
    }
    .btn:disabled { cursor: not-allowed; opacity: 0.65; }
    .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .btn-primary:hover:not(:disabled) { background: #4338ca; }
    .btn-primary:active:not(:disabled) { background: #3730a3; }
    .btn-text { background: transparent; color: #475569; padding: 0.5rem 0.75rem; min-height: 2.25rem; }
    .btn-text:hover:not(:disabled) { background: #f1f5f9; color: #0f172a; }
    .btn-danger-text { background: transparent; color: #dc2626; padding: 0.375rem 0.625rem; min-height: 2rem; font-size: 0.8125rem; }
    .btn-danger-text:hover:not(:disabled) { background: #fef2f2; }

    .field {
      width: 100%; border: 1px solid #cbd5e1; border-radius: 0.5rem;
      padding: 0.625rem 0.75rem; font-size: 0.875rem; background: #fff;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .field:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }

    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 1px 3px rgba(15,23,42,0.04); }

    .spinner {
      display: inline-block; width: 1rem; height: 1rem; border-radius: 9999px;
      border: 2px solid rgba(255,255,255,0.45); border-top-color: #fff;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .spinner-dark { border-color: rgba(15,23,42,0.2); border-top-color: #4f46e5; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge {
      display: inline-flex; align-items: center; gap: 0.375rem;
      padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500;
      white-space: nowrap;
    }
    .badge-dot { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background: currentColor; }
    .badge-queued { background: #f1f5f9; color: #475569; }
    .badge-started { background: #eff6ff; color: #2563eb; }
    .badge-started .badge-dot { animation: pulse 1.2s ease-in-out infinite; }
    .badge-finished { background: #f0fdf4; color: #16a34a; }
    .badge-failed { background: #fef2f2; color: #dc2626; }
    .badge-expired { background: #f8fafc; color: #94a3b8; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    @media (max-width: 639px) {
      .btn, .field { min-height: 2.75rem; }
    }
  </style>
</head>
<body class="h-full text-slate-900">
  {% if current_user %}
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <nav class="max-w-4xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14">
        <a href="/generate" class="font-semibold text-lg text-indigo-600 tracking-tight">Polyvox</a>

        <div class="hidden sm:flex sm:items-center sm:gap-1">
          <a href="/generate" class="btn btn-text">Generate</a>
          {% if current_user.is_admin %}
          <a href="/admin/users" class="btn btn-text">Users</a>
          <a href="/admin/api-keys" class="btn btn-text">API Keys</a>
          {% endif %}
          <span class="text-sm text-slate-400 px-2">{{ current_user.email }}</span>
          <form method="post" action="/logout" data-loading>
            <button class="btn btn-text" type="submit">Log out</button>
          </form>
        </div>

        <button id="menu-toggle" class="sm:hidden p-2 -mr-2 text-slate-600" aria-label="Toggle menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <div id="mobile-menu" class="hidden sm:hidden pb-4 flex flex-col gap-1 border-t border-slate-100 pt-3">
        <a href="/generate" class="btn btn-text justify-start">Generate</a>
        {% if current_user.is_admin %}
        <a href="/admin/users" class="btn btn-text justify-start">Users</a>
        <a href="/admin/api-keys" class="btn btn-text justify-start">API Keys</a>
        {% endif %}
        <span class="text-sm text-slate-400 px-3 py-1">{{ current_user.email }}</span>
        <form method="post" action="/logout" data-loading>
          <button class="btn btn-text justify-start w-full" type="submit">Log out</button>
        </form>
      </div>
    </nav>
  </header>
  <script>
    document.getElementById("menu-toggle").addEventListener("click", () => {
      document.getElementById("mobile-menu").classList.toggle("hidden");
    });
  </script>
  {% endif %}

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Any form marked data-loading gets an instant spinner + disabled button on
    // submit, so a full-page POST (login, logout, admin actions) never looks
    // like it hung while the browser waits on the response.
    document.addEventListener("submit", (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-loading")) return;
      const btn = form.querySelector('button[type="submit"]');
      if (!btn || btn.disabled) return;
      btn.dataset.originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Please wait…';
    });
  </script>
</body>
</html>
